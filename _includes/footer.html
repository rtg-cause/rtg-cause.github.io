<footer class="bg-light py-4 mt-5">
  <div class="container">
    <div class="row align-items-center text-center pb-4">

      <div class="col">
        {% if include.tuhh_logo_url %}
          <img src="{{ include.tuhh_logo_url }}" class="img-fluid" style="max-height:60px;" alt="Logo TU Hamburg">
        {% endif %}
      </div>

      <div class="col">
        {% if include.unib_logo_url %}
          <img src="{{ include.unib_logo_url }}" class="img-fluid" style="max-height:60px;" alt="Logo Uni Bremen">
        {% endif %}
      </div>

      <div class="col">
        {% if include.unio_logo_url %}
          <img src="{{ include.unio_logo_url }}" class="img-fluid" style="max-height:60px;" alt="Logo Uni Oldenburg">
        {% endif %}
      </div>

      <div class="col">
        {% if include.dfg_logo_url %}
          <img src="{{ include.dfg_logo_url }}" class="img-fluid" style="max-height:60px;" alt="Funded by DFG">
        {% endif %}
      </div>

    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between gap-2 pt-3 border-top small text-muted">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <span>&copy; {{ site.time | date: '%Y' }} Research Training Group CAUSE</span>
        <div class="vr"></div>
        <nav class="d-flex flex-wrap gap-3">
          <a href="{{ '/imprint' | relative_url }}" class="link-secondary text-decoration-none">Imprint</a>
        </nav>
      </div>
      <div>DFG Projektnummer: 513623283</div>
    </div>
  </div>
</footer>
